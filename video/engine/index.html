<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>StreamNavigator launch video</title>
<link rel="stylesheet" href="../fonts/fonts.css" />
<link rel="stylesheet" href="engine.css" />
</head>
<body>
<script>
  // index.html?v=<name> loads video/<name>/spec.js, then the engine.
  const q = new URLSearchParams(location.search), v = q.get('v');
  if (q.get('fmt') === 'v') document.documentElement.classList.add('vertical');
  document.write('<script src="../' + v + '/spec.js"><\/script><script src="engine.js"><\/script>');
</script>
</body>
</html>
