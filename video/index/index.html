<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>StreamNavigator — homepage launch video</title>
<link rel="stylesheet" href="../fonts/fonts-home.css" />
<style>
  /* Tokens and the solar-system styles from index.html */
  :root{
    --bg-top:#0a1230; --bg-bottom:#050914; --ink:#f2f6ff; --ink-dim:#a9b8dd; --ink-dimmer:#7887ac;
    --accent:#5b9dff; --accent-2:#8fc4ff; --gold:#ffcf70; --gold-deep:#ffab3d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1920px; height:1080px; overflow:hidden;}
  body{ font-family:'Inter',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1200px 800px at 12% -10%, rgba(88,120,255,0.20), transparent 60%),
      radial-gradient(1000px 700px at 92% 8%, rgba(70,160,255,0.14), transparent 55%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 62%, #04070f 100%); }
  #stars{ position:absolute; inset:0; }
  .scene{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; }
  .eyebrow{ display:inline-block; font-size:24px; font-weight:600; letter-spacing:.08em; color:var(--accent-2);
    background:rgba(91,157,255,.12); border:1px solid rgba(91,157,255,.35); padding:10px 22px; border-radius:999px; margin-bottom:40px; }
  h1{ font-family:'Sora',sans-serif; font-weight:800; font-size:132px; line-height:1.05; text-align:center; letter-spacing:-0.01em; }
  h1 .ph{ display:block; }
  h1 .ph.g{ background:linear-gradient(135deg, var(--accent-2), var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  #sys{ position:absolute; inset:0; }
  .ring{ position:absolute; left:50%; top:50%; border-radius:50%; border:2px dashed rgba(150,185,255,0.22); transform:translate(-50%,-50%); }
  .sun{ position:absolute; left:50%; top:492px; width:190px; height:190px; border-radius:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 38% 32%, #fff3d6, var(--gold) 45%, var(--gold-deep) 78%, #b5641c 100%);
    display:flex; align-items:center; justify-content:center; text-align:center; z-index:3; }
  .sun span{ font-family:'Sora',sans-serif; font-weight:800; color:#3c2405; font-size:30px; line-height:1.15; }
  .planet{ position:absolute; display:flex; flex-direction:column; align-items:center; width:220px; margin-left:-110px; margin-top:-24px; z-index:2; }
  .orb{ width:48px; height:48px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #dcecff, var(--accent-2) 40%, var(--accent) 72%, #23408f 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 0 22px 5px rgba(91,157,255,.5); }
  .lbl{ margin-top:12px; font-size:21px; font-weight:600; color:var(--ink-dim); text-align:center; line-height:1.2; text-shadow:0 2px 10px #050914; }
  .caption{ position:absolute; bottom:28px; left:0; right:0; text-align:center; font-size:34px; color:var(--ink-dim); }

  .tool{ text-align:center; position:absolute; }
  .tool .k{ font-family:'Sora',sans-serif; font-weight:700; font-size:30px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-2); margin-bottom:28px; }
  .tool .v{ font-family:'Sora',sans-serif; font-weight:800; font-size:92px; line-height:1.1; max-width:1500px; }
  .tool .u{ font-size:30px; color:var(--ink-dimmer); margin-top:30px; font-family:'Inter'; }

  .logo{ display:flex; align-items:center; gap:22px; font-family:'Sora',sans-serif; font-weight:800; font-size:84px; }
  .logo-mark{ width:96px; height:96px; border-radius:26px; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 55%, #2749b8 100%); }
  .logo-mark svg{ width:54px; height:54px; }
  .sub{ font-size:44px; color:var(--ink-dim); margin-top:36px; }
  .btn{ margin-top:46px; font-family:'Sora',sans-serif; font-weight:700; font-size:38px; color:#0a0f1f;
    background:linear-gradient(135deg, var(--accent-2), var(--accent)); padding:20px 48px; border-radius:999px;
    box-shadow:0 8px 30px -6px rgba(91,157,255,.55); }
</style>
</head>
<body>
<canvas id="stars" width="1920" height="1080"></canvas>

<section class="scene" id="s1">
  <div class="eyebrow">✦ StreamNavigator AI</div>
  <h1><span class="ph">Save Smarter.</span><span class="ph">Keep More.</span><span class="ph g">Live Better.</span></h1>
</section>

<section class="scene" id="s2">
  <div id="sys"><div class="sun" id="sun"><span>Your<br/>Wealth</span></div></div>
  <div class="caption" id="cap">Every tool supports one goal — smarter decisions with your money.</div>
</section>

<section class="scene" id="s3"></section>

<section class="scene" id="s4">
  <div class="logo" id="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0f1f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg></span>StreamNavigator</div>
  <div class="sub" id="sub">Explore focused tools for the decisions that matter.</div>
  <div class="btn" id="btn">streamnavigator.ai</div>
</section>

<script>
window.DURATION = 20;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const out = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const appear = (el, t, at, dy = 30, dur = 0.45) => { const k = out(p(t, at, at + dur)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; };

// Stars: fixed positions from a seeded generator, twinkle as a function of t
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = Array.from({ length: 220 }, () => [rnd() * 1920, rnd() * 1080, rnd() * 1.6 + 0.3, rnd() * 6.28]);
const ctx = $('stars').getContext('2d');

// Tools and orbits exactly as index.html lays them out
const TOOLS = [
  ['Streaming Navigator', 1, 90], ['Subscription Navigator', 1, 210], ['Home Savings Navigator', 1, 330],
  ['Property Tax Navigator', 2, 45], ['Insurance Navigator', 2, 135], ['Rental Navigator', 2, 225], ['Landlord Navigator', 2, 315],
  ['Contractor Navigator', 3, 0], ['HOA Navigator', 3, 60], ['Home Maintenance Navigator', 3, 120], ['Government Money Finder', 3, 180],
  ['Closing Navigator', 3, 240], ['Purchase Navigator', 3, 300]];
const R = { 1: [310, 200], 2: [530, 300], 3: [745, 392] }; const CY = 492;
const sys = $('sys');
[1, 2, 3].forEach((r) => { const d = document.createElement('div'); d.className = 'ring'; d.id = 'ring' + r; d.style.width = R[r][0] * 2 + 'px'; d.style.height = R[r][1] * 2 + 'px'; d.style.top = CY + 'px'; sys.appendChild(d); });
const planets = TOOLS.map(([name]) => { const d = document.createElement('div'); d.className = 'planet'; d.innerHTML = `<div class="orb"></div><div class="lbl">${name}</div>`; sys.appendChild(d); return d; });

// One line per tool, each the page's own headline
const LINES = [
  ['Streaming', 'Stop paying for streaming you don’t even watch.', '/streaming'],
  ['Property Tax', 'Find out if you’re overpaying on property taxes.', '/property-tax'],
  ['HOA', 'Find what the HOA isn’t telling you.', '/hoa'],
];
$('s3').innerHTML = LINES.map((l, i) => `<div class="tool" id="tool${i}"><div class="k">${l[0]}</div><div class="v">${l[1]}</div><div class="u">streamnavigator.ai${l[2]}</div></div>`).join('');

const scene = (el, t, a, b) => {
  const v = Math.min(a <= 0 ? 1 : p(t, a, a + 0.35), b >= 99 ? 1 : 1 - p(t, b - 0.35, b));
  el.style.display = v > 0 && t >= a - 0.01 ? 'flex' : 'none'; el.style.opacity = v; return v > 0;
};

window.seek = (t) => {
  ctx.clearRect(0, 0, 1920, 1080);
  for (const [x, y, r, ph] of STARS) { ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 1.3 + ph); ctx.fillStyle = '#cfe0ff'; ctx.beginPath(); ctx.arc(x, (y + t * 4) % 1080, r, 0, 6.29); ctx.fill(); }
  ctx.globalAlpha = 1;

  // 1. headline 0 - 4.2
  if (scene($('s1'), t, 0, 4.2)) {
    appear(document.querySelector('#s1 .eyebrow'), t, 0.05, 16);
    document.querySelectorAll('#s1 .ph').forEach((ph, i) => {
      const k = p(t, 0.3 + i * 0.7, 0.75 + i * 0.7);
      ph.style.opacity = clamp(k * 2); ph.style.transform = `scale(${lerp(0.85, 1, back(k))})`;
    });
  }

  // 2. the solar system 4.2 - 10.8
  if (scene($('s2'), t, 4.2, 10.8)) {
    const k = p(t, 4.3, 4.8);
    $('sun').style.transform = `translate(-50%,-50%) scale(${lerp(0.3, 1, back(k))})`;
    const glow = 1 + 0.25 * Math.sin(t * 1.8);
    $('sun').style.boxShadow = `0 0 ${40 * glow}px ${10 * glow}px rgba(255,190,90,.45), 0 0 ${90 * glow}px ${40 * glow}px rgba(255,170,60,.22)`;
    [1, 2, 3].forEach((r) => { const kr = out(p(t, 4.5 + r * 0.25, 5.0 + r * 0.25)); $('ring' + r).style.opacity = kr; $('ring' + r).style.transform = `translate(-50%,-50%) scale(${lerp(0.6, 1, kr)})`; });
    const spin = (t - 4.2) * 2; // degrees, slow drift
    TOOLS.forEach(([, ring, ang], i) => {
      const at = 5.3 + i * 0.22, kp = p(t, at, at + 0.4);
      const a = (ang + spin * (ring === 2 ? -1 : 1) / ring) * Math.PI / 180;
      planets[i].style.left = 960 + Math.cos(a) * R[ring][0] + 'px';
      planets[i].style.top = CY - Math.sin(a) * R[ring][1] + 'px';
      planets[i].style.opacity = clamp(kp * 2);
      planets[i].style.transform = `scale(${lerp(0.4, 1, back(kp))})`;
    });
    appear($('cap'), t, 8.4, 20);
  }

  // 3. three headlines 10.8 - 17.2
  if (scene($('s3'), t, 10.8, 17.2)) {
    LINES.forEach((l, i) => {
      const a = 10.9 + i * 2.1, b = a + 2.1, el = $('tool' + i);
      const v = Math.min(out(p(t, a, a + 0.35)), i === LINES.length - 1 ? 1 : 1 - p(t, b - 0.25, b));
      el.style.opacity = v;
      el.style.transform = `translateY(${(1 - out(p(t, a, a + 0.4))) * 50 - p(t, b - 0.25, b) * 40 * (i < LINES.length - 1)}px)`;
    });
  }

  // 4. outro 17.2 - 20
  if (scene($('s4'), t, 17.2, 99)) {
    const k = p(t, 17.3, 17.75); $('logo').style.opacity = clamp(k * 3); $('logo').style.transform = `scale(${lerp(0.7, 1, back(k))})`;
    appear($('sub'), t, 17.7); appear($('btn'), t, 18.0);
  }
};
window.seek(0);

// Soundtrack cues for synth.js
window.SCORE = [
  { t: 0.3, type: 'pop', note: 72 }, { t: 1.0, type: 'pop', note: 76 }, { t: 1.7, type: 'chime' },
  { t: 4.0, type: 'whoosh' }, { t: 4.3, type: 'tap' },
  ...TOOLS.map((x, i) => ({ t: 5.3 + i * 0.22, type: 'pop', note: [72, 74, 76, 79, 81, 84, 86, 88][i % 8] })),
  { t: 8.4, type: 'chime' }, { t: 10.6, type: 'whoosh' },
  { t: 10.9, type: 'pop' }, { t: 13.0, type: 'pop' }, { t: 15.1, type: 'pop' },
  { t: 17.0, type: 'whoosh' }, { t: 17.3, type: 'chime' },
];
</script>
</body>
</html>
