name: tests

# Runs on every push, which includes commits created by the GitHub web UI's
# "Add files via upload" — so uploading a file here is enough to get it checked.
# Nothing needs to be run locally.
#
# This exists because four separate red tests sat on main at once, three of
# them for the same reason: a decision changed in one file and its contract
# stayed behind in another. Each was caught in under a second by a suite
# nobody had run.
#
# The steps themselves live in scripts/ci.sh, not here. They used to live in
# this file only, which meant the sequence CI ran could not be run anywhere
# else — not locally, not by the Vercel deploy gate. One file, three callers,
# no drift.

on:
  push:
    branches: ['**']
  # A PR from a branch in this repo already ran on push. Without the job-level
  # filter below, every such PR runs the suite twice and, when it fails, sends
  # two identical emails.
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Push three commits in a minute and only the last one needs an answer.
# Superseded runs are cancelled instead of finishing and reporting on code that
# has already been replaced.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip the duplicate run when a pull request comes from a branch in this
    # same repository — the push event already covered that commit.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the lockfile and package.json have
      # drifted apart. It also matters that dependencies are installed at all —
      # purchase-engine.test.js needs @supabase/supabase-js, and without it the
      # suite reports 10 failures where there are really 3, which teaches
      # everyone to discount the number.
      - run: npm ci

      # Suites, render check, corpus freshness, patch scripts, clean-tree gate.
      # Identical to `npm run ci` locally and to what the Vercel deploy gate
      # runs before it will let a commit ship.
      - name: full verification (scripts/ci.sh)
        run: npm run ci
