name: videos

# Re-renders the launch videos (landscape and vertical) and attaches them to
# the run as downloadable artifacts, named the way the Dropbox Videos folder
# names them ("StreamNavigator - Contractor.mp4"). With the Dropbox secrets
# set, the vertical cut also replaces the file in that folder.
#
# It renders when a video's own script in video/<name>/ changes, or when the
# shared engine does (then every video). The videos carry their own copy of
# each page's words, so a page edit alone would render the same video again;
# instead the run summary lists those videos as possibly out of date.
#
# To render by hand: Actions -> videos -> Run workflow, and enter "all" or a
# list such as "contractor,hoa".

on:
  push:
    branches: [main]
    paths: ['video/**', '*.html', '.github/workflows/videos.yml']
  workflow_dispatch:
    inputs:
      pages:
        description: 'Videos to render: "all", or names such as contractor,hoa'
        default: all
        required: true

concurrency:
  group: videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.plan.outputs.render }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          PAGES: ${{ github.event.inputs.pages }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            out=$(node video/changed.js --pages "$PAGES")
          else
            out=$(node video/changed.js "$BASE" "$HEAD")
          fi
          echo "$out"
          render=$(node -e "console.log(JSON.stringify(JSON.parse(process.argv[1]).render))" "$out")
          stale=$(node -e "console.log(JSON.parse(process.argv[1]).stale.join(', '))" "$out")
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$render" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          {
            echo "### Videos"
            echo "Rendering: ${render}"
            if [ -n "$stale" ]; then
              echo ""
              echo "**Possibly out of date:** $stale"
              echo ""
              echo "These pages changed but their video scripts (video/<name>/spec.js or index.html) did not."
              echo "Update the script with the page's new copy and the video will re-render on the next push."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        video: ${{ fromJSON(needs.plan.outputs.render) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg and a headless browser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render landscape and vertical
        run: |
          bash video/build.sh "${{ matrix.video }}"
          FORMAT=v bash video/build.sh "${{ matrix.video }}"
      - name: Name files for the Dropbox folder
        run: |
          title=$(node -e '
            const t = { index: "Homepage", buying: "Purchase", hoa: "HOA" };
            const n = process.argv[1];
            console.log(t[n] || n.split("-").map((w) => w[0].toUpperCase() + w.slice(1)).join(" "));
          ' "${{ matrix.video }}")
          mkdir -p out/landscape out/vertical
          cp "brag-output/${{ matrix.video }}/brag.mp4" "out/landscape/StreamNavigator - $title.mp4"
          cp "brag-output/${{ matrix.video }}/vertical.mp4" "out/vertical/StreamNavigator - $title.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.video }}
          path: out/
          retention-days: 30
      # Replaces the vertical video in the Dropbox Videos folder. Needs three
      # repository secrets: DROPBOX_APP_KEY, DROPBOX_APP_SECRET and
      # DROPBOX_REFRESH_TOKEN (a refresh token never expires; the access token
      # it buys lasts four hours, which is why a fixed token is not used).
      # Without them this step is skipped and the artifact is the delivery.
      - name: Upload to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_FOLDER: /AI Business/StreamNavigator/Videos
        run: |
          if [ -z "$DROPBOX_REFRESH_TOKEN" ]; then
            echo "Dropbox secrets not set; skipping upload."
            exit 0
          fi
          token=$(curl -sSf https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
            -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).access_token))')
          echo "::add-mask::$token"
          for f in out/vertical/*.mp4; do
            arg=$(node -e 'console.log(JSON.stringify({ path: process.argv[1], mode: "overwrite", mute: true }))' "$DROPBOX_FOLDER/$(basename "$f")")
            curl -sSf https://content.dropboxapi.com/2/files/upload \
              -H "Authorization: Bearer $token" -H "Content-Type: application/octet-stream" \
              -H "Dropbox-API-Arg: $arg" --data-binary @"$f" > /dev/null
            echo "Uploaded $DROPBOX_FOLDER/$(basename "$f")"
          done
